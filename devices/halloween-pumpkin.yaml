# Carved pumpkin with a short CW/WW strip, a PIR and a speaker on an ESP32-C3 SuperMini.
#
# Wiring:
#  - CW strip on GPIO4, WW on GPIO3, each through a logic-level MOSFET. Both pins float until the
#    firmware starts, so a 10-100k pull-down on each gate keeps the strip dark during boot.
#  - AM312 mini PIR: VIN -> 3V3, GND -> GND, OUT -> GPIO5.
#  - MAX98357A amp: VIN -> 5V, GND -> GND, BCLK -> GPIO6, LRC -> GPIO7, DIN -> GPIO10.
#
# Onboard BOOT button (GPIO9): click = next effect, double-click = jump scare, hold 1 s = on/off.
# Every scare plays a random clip from audio_file: below.
# Quiet hours (quiet_hours_start to quiet_hours_end, Home Assistant's time zone): the pumpkin is off
# and only the PIR wakes it, for a single scare.
substitutions:
  name: halloween-pumpkin
  friendly_name: Halloween Pumpkin
  area: Kitchen
  project: lights.pumpkin
  version: "1.0"
  # The C3's LEDC tops out at 14 bits and keeps all 14 up to ~4.88 kHz. Higher also keeps phone
  # videos of the pumpkin free of rolling bands.
  # Drop to ~1 kHz if the MOSFET board is opto-isolated (PC817 and friends are slow).
  frequency: 4800Hz
  # "HH:MM", quoted (unquoted YAML reads 20:30 as a number). The window may span midnight.
  quiet_hours_start: "20:30"
  quiet_hours_end: "07:30"
  repo_sounds: https://raw.githubusercontent.com/csobrinho/esphome-projects/main/sounds/halloween

api:
  encryption:
    key: !secret encryption_key
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

packages:
  base:
    url: https://github.com/csobrinho/esphome-projects/
    refresh: 1sec
    ref: main
    files:
      - path: base/esp32-c3-mini.yaml
      - path: addon/io/light_cwww.yaml
        vars: { name: "Pumpkin", dev: "pumpkin", led_cw_pin: GPIO4, led_ww_pin: GPIO3 }
      - path: addon/io/light_cwww_halloween.yaml
        vars: { name: "Pumpkin", dev: "pumpkin" }
      - path: addon/io/speaker_max98357a.yaml
        vars: { name: "Pumpkin", dev: "pumpkin", i2s_bclk_pin: GPIO6, i2s_lrclk_pin: GPIO7, i2s_dout_pin: GPIO10 }
      - path: addon/sounds/soundboard.yaml
        vars:
          dev: "pumpkin"
          sounds:
            Evil Laugh: pumpkin_sound_evil_laugh
            Maniac Laugh: pumpkin_sound_maniac_laugh
            Witch Cackle: pumpkin_sound_witch_cackle
            Long Evil Laugh: pumpkin_sound_long_evil_laugh
            Witches Laughing: pumpkin_sound_witches_laughing
            Some Laughs: pumpkin_sound_some_laughs
            Beetlejuice: pumpkin_sound_beetlejuice
            Keep the Change: pumpkin_sound_keep_the_change
            Cooking Frankie: pumpkin_sound_cooking_frankie
            Trick or Treat: pumpkin_sound_trick_or_treat
            Happy Halloween: pumpkin_sound_happy_halloween
            School of Roars: pumpkin_sound_school_of_roars
            Spooky Tree: pumpkin_sound_spooky_tree
            Let Me Out: pumpkin_sound_let_me_out
            It's Alive: pumpkin_sound_its_alive
            Here's Johnny: pumpkin_sound_heres_johnny
            Meddling Kids: pumpkin_sound_meddling_kids
            Put That Thing Back: pumpkin_sound_put_that_thing_back
            Scary Movie: pumpkin_sound_scary_movie
      - path: addon/time_window.yaml
        vars: { id: "pumpkin_quiet_hours", window_start: "${quiet_hours_start}", window_end: "${quiet_hours_end}" }

audio_file: # https://esphome.io/components/audio_file/
  - { id: pumpkin_sound_evil_laugh, file: "${repo_sounds}/evil_laugh.mp3" }
  - { id: pumpkin_sound_maniac_laugh, file: "${repo_sounds}/maniac_laugh.mp3" }
  - { id: pumpkin_sound_witch_cackle, file: "${repo_sounds}/witch_cackle.mp3" }
  - { id: pumpkin_sound_long_evil_laugh, file: "${repo_sounds}/long_evil_laugh.mp3" }
  - { id: pumpkin_sound_witches_laughing, file: "${repo_sounds}/witches_laughing.mp3" }
  - { id: pumpkin_sound_some_laughs, file: "${repo_sounds}/some_laughs.mp3" }
  - { id: pumpkin_sound_beetlejuice, file: "${repo_sounds}/beetlejuice.mp3" }
  - { id: pumpkin_sound_keep_the_change, file: "${repo_sounds}/keep_the_change.mp3" }
  - { id: pumpkin_sound_cooking_frankie, file: "${repo_sounds}/cooking_frankie.mp3" }
  - { id: pumpkin_sound_trick_or_treat, file: "${repo_sounds}/trick_or_treat.mp3" }
  - { id: pumpkin_sound_happy_halloween, file: "${repo_sounds}/happy_halloween.mp3" }
  - { id: pumpkin_sound_school_of_roars, file: "${repo_sounds}/school_of_roars.mp3" }
  - { id: pumpkin_sound_spooky_tree, file: "${repo_sounds}/spooky_tree.mp3" }
  - { id: pumpkin_sound_let_me_out, file: "${repo_sounds}/let_me_out.mp3" }
  - { id: pumpkin_sound_its_alive, file: "${repo_sounds}/its_alive.mp3" }
  - { id: pumpkin_sound_heres_johnny, file: "${repo_sounds}/heres_johnny.mp3" }
  - { id: pumpkin_sound_meddling_kids, file: "${repo_sounds}/meddling_kids.mp3" }
  - { id: pumpkin_sound_put_that_thing_back, file: "${repo_sounds}/put_that_thing_back.mp3" }
  - { id: pumpkin_sound_scary_movie, file: "${repo_sounds}/scary_movie.mp3" }

esphome:
  on_boot:
    priority: 200 # After the light is set up, without waiting for Wi-Fi.
    then:
      - light.turn_on:
          id: pumpkin_light
          effect: Candle

light:
  - id: !extend pumpkin_light
    name: None # Named after the device: light.halloween_pumpkin.
    on_turn_on:
      # A plain "on" from Home Assistant comes back as a candle instead of a static light.
      - if:
          condition:
            lambda: return id(pumpkin_light).get_effect_name() == "None";
          then:
            - light.turn_on:
                id: pumpkin_light
                effect: Candle

media_player:
  - id: !extend pumpkin_audio
    name: Speaker

number:
  - id: !extend pumpkin_random_minutes
    name: Random Interval

select:
  - id: !extend pumpkin_effect
    name: Effect
    on_value:
      # Play a random sound as each scare starts.
      - if:
          condition:
            lambda: return x == "Scare";
          then:
            - delay: 550ms # Land on the cold blast after the effect's 600 ms of darkness.
            - script.execute: pumpkin_play_random_sound

binary_sensor:
  - platform: gpio # https://esphome.io/components/binary_sensor/gpio/
    id: boot_button
    internal: true
    pin:
      number: GPIO9
      inverted: true
      mode: { input: true, pullup: true }
      ignore_strapping_warning: true # Read only after boot; holding it at power-up enters download mode.
    on_multi_click:
      - timing: [ON for at most 600ms, OFF for at least 400ms]
        then:
          - light.effect.next: pumpkin_light
      - timing: [ON for at most 600ms, OFF for at most 400ms, ON for at most 600ms, OFF for at least 50ms]
        then:
          - script.execute: pumpkin_scare
      - timing: [ON for at least 1s]
        then:
          - light.toggle: pumpkin_light

  - platform: gpio
    id: pumpkin_motion
    name: Motion
    device_class: motion
    pin:
      number: GPIO5
      mode: { input: true }
    filters:
      - delayed_off: 20s # One scare per visit
    on_press:
      - if:
          condition:
            light.is_on: pumpkin_light
          then:
            - script.execute: pumpkin_scare
          else:
            - if:
                condition:
                  binary_sensor.is_on: pumpkin_quiet_hours
                then:
                  - script.execute: pumpkin_quiet_scare

  # Off for quiet hours, back on (Candle) when they end.
  - id: !extend pumpkin_quiet_hours
    on_press:
      - light.turn_off: pumpkin_light
    on_release:
      - light.turn_on: pumpkin_light

script:
  # From dark: one pass of the Scare effect, then dark again.
  - id: pumpkin_quiet_scare
    mode: single
    then:
      - light.turn_on:
          id: pumpkin_light
          effect: Scare
      - delay: 3200ms # One pass of the Scare effect.
      - light.turn_off: pumpkin_light
