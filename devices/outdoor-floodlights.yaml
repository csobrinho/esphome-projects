esphome:
  name: outdoor-floodlights
  friendly_name: Outdoor Floodlights
  area:
    name: Outdoor
  name_add_mac_suffix: false
  project:
    name: lights.flood
    version: "1.0"

bk72xx:
  board: generic-bk7231n-qfn32-tuya

logger:

web_server:
  port: 80

api:
  encryption:
    key: !secret encryption_key

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

button:
  - platform: restart
    id: restart_button
    name: Restart
  - platform: safe_mode
    name: "Restart (Safe Mode)"

safe_mode:
  disabled: false

debug:
  update_interval: 30s

text_sensor:
  - platform: debug
    reset_reason:
      name: Reset Reason
  - platform: libretiny
    version:
      name: LibreTiny Version

sensor:
  - platform: uptime
    name: Uptime

output:
  - platform: libretiny_pwm
    id: output_cw
    pin: P26
  - platform: libretiny_pwm
    id: output_ww
    pin: P6

light:
  - platform: cwww
    name: Flood Light
    cold_white: output_cw
    warm_white: output_ww
    # constant_brightness: true
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K
