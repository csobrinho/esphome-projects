# Status LED https://esphome.io/components/status_led/
#
# Add this to the esphome config under substitutions to set the I2C GPIOs for the bus.
#  status_led_pin: GPIO33
status_led:
  pin:
    number: ${status_led_pin}
    inverted: true

binary_sensor:
  - platform: status
    name: "${friendly_name} Status"
