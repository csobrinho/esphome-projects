# Status LED https://esphome.io/components/status_led/
#
# Drives the board's onboard LED (active low) as the status LED. Add this to the esphome config
# under substitutions to set its GPIO.
#  status_led_pin: GPIO8
status_led:
  pin:
    number: ${status_led_pin}
    inverted: true
    ignore_strapping_warning: true # Onboard LEDs often sit on strapping pins, like GPIO8 on the C3.
