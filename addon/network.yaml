binary_sensor:
  # Online Status https://esphome.io/components/binary_sensor/status/
  - platform: status
    name: "Online"
    id: status_sensor
    icon: mdi:check-network

sensor:
  # Last Boot https://esphome.io/components/sensor/uptime/
  # The boot time, published once when the clock first syncs. Home Assistant shows it as relative
  # time ("8 minutes ago").
  - platform: uptime
    type: timestamp
    name: "Last Boot"
    id: last_boot

  # Wifi Signal Strength https://esphome.io/components/sensor/wifi_signal/
  - platform: wifi_signal
    name: "Wifi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"
    internal: true

  # Wifi Signal Strength.
  - platform: copy
    source_id: wifi_signal_db
    name: "Wifi Strength"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
      - delta: 5 # Only report changes of at least 5 points (2.5 dB).
    unit_of_measurement: "%"
    icon: mdi:wifi
    entity_category: "diagnostic"
    device_class: ""

text_sensor:
  # IP Address https://esphome.io/components/text_sensor/wifi_info/
  - platform: wifi_info
    ip_address:
      name: IP Address
      icon: mdi:ip-network
    mac_address:
      name: MAC Address
      icon: mdi:ip-network
    bssid:
      name: "BSSID"
      icon: mdi:ip-network

  # ESPHome Version https://esphome.io/components/text_sensor/version/
  - platform: version
    name: Version
    icon: mdi:package-variant-closed
    hide_timestamp: true

