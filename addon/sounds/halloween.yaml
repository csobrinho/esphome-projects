# Halloween sound clips, with a script and a Sound select + Play Sound button to play them.
# https://esphome.io/components/audio_file/
#
# Plays on the media player from addon/io/speaker_max98357a.yaml. Include after it, with the same
# dev var:
#  dev: "pumpkin"
#
# and optionally, globally, to use your own clips (16 kHz, mono, 16-bit WAV, same file names):
#  halloween_sounds: sounds # A folder next to the device config, or any http(s) URL.
#
# Provides:
#  - script ${dev}_play_halloween_sound: plays one clip at random, never the same one twice in a row.
#  - select "Sound" (id ${dev}_sound) and button "Play Sound": the button plays the selected clip,
#    or a random one for Random.
#
# Clips download from sounds/halloween/ in this repo at compile time.
substitutions:
  halloween_sounds: https://raw.githubusercontent.com/csobrinho/esphome-projects/main/sounds/halloween

audio_file:
  - id: ${dev}_sound_evil_laugh
    file: ${halloween_sounds}/evil_laugh.wav
  - id: ${dev}_sound_maniac_laugh
    file: ${halloween_sounds}/maniac_laugh.wav
  - id: ${dev}_sound_witch_cackle
    file: ${halloween_sounds}/witch_cackle.wav
  - id: ${dev}_sound_ghost_moan
    file: ${halloween_sounds}/ghost_moan.wav
  - id: ${dev}_sound_ghost_shriek
    file: ${halloween_sounds}/ghost_shriek.wav
  - id: ${dev}_sound_thunder
    file: ${halloween_sounds}/thunder.wav

script:
  - id: ${dev}_play_halloween_sound
    then:
      - lambda: |-
          // Element type deduced from the ids, so it matches play_file() whether it takes a const pointer or not.
          const std::array sounds{id(${dev}_sound_evil_laugh), id(${dev}_sound_maniac_laugh), id(${dev}_sound_witch_cackle),
                                  id(${dev}_sound_ghost_moan), id(${dev}_sound_ghost_shriek), id(${dev}_sound_thunder)};
          static size_t last = SIZE_MAX;
          size_t pick = random_uint32() % sounds.size();
          if (pick == last) pick = (pick + 1) % sounds.size();
          last = pick;
          id(${dev}_audio).play_file(sounds[pick], true, false);

select:
  - platform: template # https://esphome.io/components/select/template/
    id: ${dev}_sound
    name: Sound
    icon: mdi:music-box
    options: [Random, Evil Laugh, Maniac Laugh, Witch Cackle, Ghost Moan, Ghost Shriek, Thunder] # Clips in the same order as the audio files.
    initial_option: Random
    optimistic: true
    restore_value: true

button:
  - platform: template # https://esphome.io/components/button/template/
    id: ${dev}_play_sound
    name: Play Sound
    icon: mdi:play
    on_press:
      - lambda: |-
          const std::array sounds{id(${dev}_sound_evil_laugh), id(${dev}_sound_maniac_laugh), id(${dev}_sound_witch_cackle),
                                  id(${dev}_sound_ghost_moan), id(${dev}_sound_ghost_shriek), id(${dev}_sound_thunder)};
          const auto index = id(${dev}_sound).active_index();
          if (!index.has_value() || *index == 0) {
            id(${dev}_play_halloween_sound).execute();
          } else {
            id(${dev}_audio).play_file(sounds[*index - 1], true, false);
          }
