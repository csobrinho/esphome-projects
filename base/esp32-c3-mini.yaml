esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  area: "${area}"
  min_version: 2026.10.0
  name_add_mac_suffix: false
  project:
    name: "${project}"
    version: "${version}"

esp32:
  variant: esp32c3
  framework:
    type: esp-idf
    version: recommended
    advanced:
      # Links only the generic SPI flash driver, the one the C3 SuperMini's flash runs on; the
      # vendor drivers would sit unused in IRAM.
      flash_chip: generic

packages:
  - !include ../addon/logger.yaml
  - !include ../addon/network.yaml
  - !include ../addon/ota.yaml
  - !include ../addon/restart.yaml
  - !include ../addon/safe_mode.yaml
  - !include ../addon/factory_reset.yaml
  - !include ../addon/time.yaml
  - !include ../addon/webserver.yaml
